<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1730">
<meta name="description" content="Cuaderno interactivo para estudiar matemáticas: recta numérica animada, ejercicios, quiz y tarjetas.">
<title>MateLab · Cuaderno interactivo</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<div id="app">
  <header class="topbar">
    <button class="brand" id="home" type="button" aria-label="Ir al inicio">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M6 30 14 12l6 12 6-12 8 18" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="12" r="2.6" fill="currentColor"/><circle cx="26" cy="12" r="2.6" fill="currentColor"/></svg>
      </span>
      <span class="brand-text"><b>MateLab</b><small>cuaderno interactivo</small></span>
    </button>

    <div class="top-actions">
      <div class="progress-pill" id="progressPill" title="Progreso general">
        <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-bg" cx="22" cy="22" r="18"/>
          <circle class="ring-fg" id="ringFg" cx="22" cy="22" r="18"/>
        </svg>
        <span id="progressText">0/5</span>
      </div>
      <button class="icon-btn" id="tema-btn" type="button" title="Cambiar tema (T)" aria-label="Cambiar tema">☾</button>
    </div>
  </header>

  <nav id="chips" class="chips" aria-label="Temas"></nav>

  <main id="vista" class="vista" aria-live="polite"></main>

  <footer class="footer">
    <span>Hecho para estudiar, no para memorizar.</span>
    <button id="reiniciar" type="button">Reiniciar progreso</button>
  </footer>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/widgets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
